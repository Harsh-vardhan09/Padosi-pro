name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padosi
          POSTGRES_PASSWORD: padosi
          POSTGRES_DB: padosipro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U padosi -d padosipro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Throwaway values for an ephemeral CI database, the same reasoning as docker-compose.yml.
    # Nothing here unlocks anything outside this job.
    env:
      DATABASE_URL: postgres://padosi:padosi@localhost:5432/padosipro_test
      TEST_DATABASE_URL: postgres://padosi:padosi@localhost:5432/padosipro_test
      DB_SSL: 'false'
      JWT_SECRET: ci-jwt-secret-at-least-16-chars
      OTP_PEPPER: ci-otp-pepper-at-least-16-chars
      MAIL_DRIVER: console

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Without these the integration tests have no schema and no task catalogue to choose from.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the task catalogue
        run: npm run db:seed

      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  mobile:
    name: Mobile (lint, typecheck)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
