# One command for a reviewer: `docker compose up` — Postgres on 5432, the API on 4000.
# The credentials below are local throwaways, which is why they can live in this file.

name: padosipro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padosi
      POSTGRES_PASSWORD: padosi
      POSTGRES_DB: padosipro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosi -d padosipro"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Integration tests only: `docker compose --profile test up -d db-test`.
  # Behind a profile so a plain `docker compose up` still starts just Postgres + the API.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padosi
      POSTGRES_PASSWORD: padosi
      POSTGRES_DB: padosipro_test
    ports:
      - "5433:5432"
    # No volume: the data lives in tmpfs, so every run starts from an empty database.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosi -d padosipro_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      # `db` is the service name above; Compose resolves it on the shared network.
      DATABASE_URL: postgres://padosi:padosi@db:5432/padosipro
      DB_SSL: "false"
      JWT_SECRET: local-dev-only-jwt-secret-change-me
      JWT_EXPIRES_IN: 7d
      OTP_PEPPER: local-dev-only-otp-pepper-change-me
      # console prints the OTP to `docker compose logs api`; set to emailjs with the keys below.
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
