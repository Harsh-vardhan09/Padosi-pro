# One command for a reviewer: `docker compose up` — Postgres on 5432, the API on 4000.
# The credentials below are local throwaways, which is why they can live in this file.

name: padosipro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padosi
      POSTGRES_PASSWORD: padosi
      POSTGRES_DB: padosipro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql in this directory runs once, when the volume is first created.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosi -d padosipro"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      # `db` is the service name above; Compose resolves it on the shared network.
      DATABASE_URL: postgres://padosi:padosi@db:5432/padosipro
      # Empty is treated as unset, so the stack runs without EmailJS credentials.
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
